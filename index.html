<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>立體圖形奇妙樂園｜小一數學</title><style>
:root{--p:#f4489c;--d:#ad216d;--ink:#51334a}*{box-sizing:border-box}body{margin:0;background:linear-gradient(150deg,#ffe6f2,#fff1f8 45%,#ffdbec);font-family:'PingFang TC','Microsoft JhengHei',sans-serif;color:var(--ink)}.wrap{max-width:940px;margin:auto;padding:25px 16px 60px}.hero{text-align:center}h1{font-size:clamp(27px,5vw,44px);color:#c82979;margin:12px 0}p{line-height:1.65}.panel{border:4px solid #ffb5d5;background:#fffafd;border-radius:32px;padding:25px;box-shadow:0 10px 26px #e97caf32}.badge{display:inline-block;background:#ffdaed;color:#a11d65;border-radius:50px;padding:8px 18px;font-weight:800}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.progress{background:#ffe3ef;height:18px;border-radius:30px;overflow:hidden;margin:18px 0}.bar{width:0;height:100%;background:linear-gradient(90deg,#ff92bc,#f03091);transition:width .25s}.question{font-size:clamp(23px,4vw,32px);font-weight:900;text-align:center;margin:20px auto;line-height:1.4}.scene{min-height:215px;background:linear-gradient(#fff 55%,#fce7f0);border:2px dashed #fbc1da;border-radius:24px;display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;padding:20px}.shape{width:min(24vw,145px);height:156px;display:grid;place-items:center}.shape svg{width:100%;height:100%;filter:drop-shadow(0 8px 4px #a663883b)}.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:22px 0}.opt{border:3px solid #ffc1d9;background:#fff;border-radius:20px;padding:18px 8px;font-size:clamp(19px,2.8vw,26px);font-weight:850;color:#76234f;cursor:pointer;min-height:74px}.opt:hover,.opt:focus-visible{background:#fff0f8;border-color:#ed4797}.opt.correct{background:#d9f9e5;border-color:#36bb75}.opt.wrong{background:#ffe0e0;border-color:#f15a73}.opt:disabled{cursor:default}.action{background:#f03d93;color:white;border:0;border-radius:45px;padding:16px 30px;font-size:22px;font-weight:900;cursor:pointer}.action:disabled{background:#d5a8c0;cursor:default}.hint{min-height:46px;text-align:center;color:#ad216d;font-size:20px;font-weight:800}.footer{text-align:center;font-size:14px;color:#85536e;margin-top:25px}.hide{display:none!important}input{border:3px solid #f9b4d4;border-radius:16px;font-size:23px;padding:14px;width:min(100%,350px);text-align:center}.voicebar{display:flex;justify-content:center;gap:12px;align-items:center;flex-wrap:wrap;margin:10px 0}.voicebtn{font-size:19px;font-weight:800;border:2px solid #e8549e;background:#ffecf6;color:#a91e6b;border-radius:20px;padding:12px 18px;cursor:pointer}.voicebtn:focus-visible{outline:3px solid #b91e6f}.small{font-size:16px}.trophy{font-size:80px}.name{color:#b32675}.lesson{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:16px 0}.lesson span{background:#ffe2ef;border-radius:14px;padding:7px 12px;font-weight:700}@media(max-width:520px){.opts{grid-template-columns:1fr}.scene{min-height:175px;padding:8px}.shape{height:115px}.panel{padding:16px}}
</style></head><body><main class="wrap"><header class="hero"><div style="font-size:50px">🦄 🌸 ⭐</div><h1>立體圖形奇妙樂園</h1><p>小學一年級數學 · 20 題粉紅挑戰 · iPad Safari 版</p></header>
<section id="welcome" class="panel" style="text-align:center"><div style="font-size:58px">🏰💗</div><h2>歡迎來到圖形城堡！</h2><p>認識角柱、圓柱、角錐、圓錐和球，完成四關即可獲得星星獎勵！</p><div class="lesson"><span>① 認識圖形</span><span>② 分類</span><span>③ 堆疊</span><span>④ 滾動</span></div><label for="name"><strong>請輸入你的名字：</strong></label><p><input id="name" maxlength="18" placeholder="學生名字" autocomplete="off"></p><button class="action" onclick="start()">開始闖關 ▶</button><p class="small" style="margin-top:20px">📱 iPad：請在 Safari 網頁中開啟遊戲。按「開始闖關」後可使用 🔊 聽題目。</p></section>
<section id="play" class="panel hide"><div class="row"><span class="badge" id="level"></span><strong id="counter"></strong><strong id="score"></strong></div><div class="progress"><div class="bar" id="bar"></div></div><div class="question" id="question"></div><div class="voicebar"><button type="button" class="voicebtn" onclick="speakQuestion()" aria-label="再聽一次題目和選項">🔊 再聽一次</button><button type="button" class="voicebtn" id="voiceToggle" onclick="toggleVoice()" aria-pressed="true">🔈 自動讀題：開</button></div><div class="scene" id="scene" aria-label="立體圖形示意圖"></div><div class="opts" id="options"></div><div id="feedback" class="hint" aria-live="polite"></div><div style="text-align:center"><button id="next" class="action hide" onclick="advance()">下一題 ➜</button></div></section>
<section id="end" class="panel hide" style="text-align:center"><div class="trophy" id="trophy">🏆</div><h2 id="endingTitle"></h2><h2 class="name" id="endingName"></h2><p id="endingScore" style="font-size:26px;font-weight:900"></p><p id="endingMessage"></p><button class="action" onclick="restart()">再玩一次 ↻</button></section>
<p class="footer">參考香港教育局小學數學「1S1 立體圖形（一）」學習重點。圖形為簡化示意，堆疊及滾動題目以圖中擺放方式及一般實物操作為準。</p></main><script>
const questions=[
// stage 1
{q:'這是甚麼立體圖形？',s:['prism'],a:['角柱','角錐','圓錐','球'],c:0,tip:'角柱有平平的面。'},
{q:'這是甚麼立體圖形？',s:['cylinder'],a:['圓柱','球','角錐','角柱'],c:0,tip:'圓柱有兩個圓形的底面。'},
{q:'這是甚麼立體圖形？',s:['pyramid'],a:['圓柱','角錐','球','角柱'],c:1,tip:'角錐有一個尖頂。'},
{q:'這是甚麼立體圖形？',s:['cone'],a:['角柱','球','圓錐','圓柱'],c:2,tip:'圓錐有一個圓形底面和一個尖頂。'},
{q:'這是甚麼立體圖形？',s:['sphere'],a:['角錐','圓錐','角柱','球'],c:3,tip:'球是圓滾滾的。'},
// stage 2
{q:'哪一個是球？',s:['prism','sphere','cone'],a:['左邊','中間','右邊'],c:1,tip:'中間是球。'},
{q:'哪一個是圓柱？',s:['pyramid','cone','cylinder'],a:['左邊','中間','右邊'],c:2,tip:'右邊是圓柱。'},
{q:'哪一個是角錐？',s:['pyramid','prism','sphere'],a:['左邊','中間','右邊'],c:0,tip:'左邊是角錐。'},
{q:'哪一個是圓錐？',s:['cylinder','cone','pyramid'],a:['左邊','中間','右邊'],c:1,tip:'中間是圓錐。'},
{q:'哪一個是角柱？',s:['sphere','cylinder','prism'],a:['左邊','中間','右邊'],c:2,tip:'右邊是角柱。'},
// stage 3
{q:'兩個角柱平放，通常能平穩地疊起來嗎？',s:['prism','prism'],a:['能','不能'],c:0,tip:'角柱有平坦的面，可以面對面堆疊。'},
{q:'兩個球可以像積木一樣平穩地疊起來嗎？',s:['sphere','sphere'],a:['能','不能'],c:1,tip:'球沒有平面，不能像積木一樣穩穩疊起。'},
{q:'兩個直立的圓柱，平面對平面，能平穩地疊起來嗎？',s:['cylinder','cylinder'],a:['能','不能'],c:0,tip:'直立圓柱的平面可以用來堆疊。'},
{q:'哪一組較容易平穩地堆疊？',s:['prism','sphere'],a:['兩個角柱','兩個球'],c:0,tip:'角柱可以用平面堆疊。'},
{q:'哪一個放在尖頂上，最難穩穩站立？',s:['cone','prism'],a:['圓錐','角柱'],c:0,tip:'圓錐的尖頂不容易支撐整個圖形。'},
// stage 4
{q:'球放在斜板上，通常會怎樣？',s:['sphere'],a:['滾動','不會滾動'],c:0,tip:'球的表面是彎曲的，所以容易滾動。'},
{q:'圓柱側放在斜板上，能滾動嗎？',s:['cylinder'],a:['能','不能'],c:0,tip:'圓柱側放時可以沿着曲面滾動。'},
{q:'角柱平放在斜板上，通常能像球一樣滾動嗎？',s:['prism'],a:['能','不能'],c:1,tip:'角柱的平面使它不容易連續滾動。'},
{q:'圓錐側放在斜板上，能滾動嗎？',s:['cone'],a:['能','不能'],c:0,tip:'圓錐的曲面可以滾動，路徑通常是彎的。'},
{q:'哪一種圖形能平穩堆疊，也能側放滾動？',s:['cylinder','sphere','pyramid'],a:['圓柱','球','角錐'],c:0,tip:'圓柱直立時可以堆疊，側放時可以滾動。'}
];
const colors={prism:['#ffb7ca','#ed7ca3','#ffdaea'],cylinder:['#b8a0ff','#927ce1','#ddd0ff'],pyramid:['#f3bc62','#d58e32','#ffe1a5'],cone:['#95d9a0','#47b77e','#c8efb7'],sphere:['#63d4ff','#168cdb','#d3f5ff']};
function svg(t){let [a,b,c]=colors[t];let body={prism:`<polygon points="29,34 111,34 133,18 51,18" fill="${c}"/><polygon points="111,34 133,18 133,112 111,132" fill="${b}"/><rect x="29" y="34" width="82" height="98" fill="${a}" stroke="${b}" stroke-width="2"/>`,cylinder:`<ellipse cx="80" cy="28" rx="53" ry="18" fill="${c}" stroke="${b}" stroke-width="2"/><path d="M27 28 V116 Q80 154 133 116 V28 Q80 62 27 28" fill="${a}" stroke="${b}" stroke-width="2"/><ellipse cx="80" cy="28" rx="53" ry="18" fill="${c}" stroke="${b}" stroke-width="2"/>`,pyramid:`<polygon points="80,12 139,116 25,116" fill="${a}" stroke="${b}" stroke-width="2"/><polygon points="80,12 139,116 94,137" fill="${b}"/><polygon points="25,116 94,137 139,116" fill="${c}"/>`,cone:`<path d="M80 10 L137 121 Q80 156 23 121 Z" fill="${a}" stroke="${b}" stroke-width="2"/><path d="M23 121 Q80 86 137 121 Q80 156 23 121" fill="${c}" stroke="${b}" stroke-width="2"/>`,sphere:`<defs><radialGradient id="g"><stop offset="0" stop-color="${c}"/><stop offset="0.75" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></radialGradient></defs><circle cx="80" cy="78" r="61" fill="url(#g)"/>`}[t];return `<div class="shape"><svg viewBox="0 0 160 160" role="img" aria-label="${{prism:'角柱',cylinder:'圓柱',pyramid:'角錐',cone:'圓錐',sphere:'球'}[t]}">${body}</svg></div>`}
let i=0,score=0,locked=false,student='',voiceEnabled=true,voiceToken=0;
const speechSupported='speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
function unlockAudio(){try{if(speechSupported){window.speechSynthesis.resume();window.speechSynthesis.getVoices()}}catch(e){}}function stopSpeech(){voiceToken++;if(speechSupported)window.speechSynthesis.cancel()}
function cantoneseVoice(){if(!speechSupported)return null;const vs=window.speechSynthesis.getVoices();return vs.find(v=>/^zh[-_]HK$/i.test(v.lang))||vs.find(v=>/cantonese|hong kong|粵|廣東/i.test(v.name))||vs.find(v=>/^zh/i.test(v.lang))||null}
function speak(text){if(!speechSupported){$('feedback').textContent='此瀏覽器不支援語音朗讀，請使用較新版本的 Chrome、Edge 或 Safari。';return}stopSpeech();const u=new SpeechSynthesisUtterance(text);u.lang='zh-HK';u.rate=0.82;u.pitch=1.08;u.volume=1;const v=cantoneseVoice();if(v)u.voice=v;window.speechSynthesis.speak(u);try{window.speechSynthesis.resume()}catch(e){}}
function speakQuestion(){unlockAudio();const q=questions[i];speak('第'+(i+1)+'題。'+q.q+'。'+q.a.map((v,j)=>'選項'+(j+1)+'，'+v).join('。')+'。請選擇答案。')}
function toggleVoice(){unlockAudio();voiceEnabled=!voiceEnabled;$('voiceToggle').textContent=voiceEnabled?'🔈 自動讀題：開':'🔇 自動讀題：關';$('voiceToggle').setAttribute('aria-pressed',String(voiceEnabled));if(voiceEnabled)speakQuestion();else stopSpeech()}
function $(id){return document.getElementById(id)}function chime(ok){try{let a=new (window.AudioContext||window.webkitAudioContext)();let o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.type='sine';o.frequency.value=ok?660:290;g.gain.value=.06;o.start();o.stop(a.currentTime+.14);o.onended=()=>a.close()}catch(e){}}
function start(){unlockAudio();stopSpeech();student=$('name').value.trim()||'小勇士';$('welcome').classList.add('hide');$('play').classList.remove('hide');render()}function render(){locked=false;let x=questions[i];$('level').textContent=['第一關｜認識圖形','第二關｜圖形分類','第三關｜堆疊','第四關｜滾動'][Math.floor(i/5)];$('counter').textContent=`第 ${i+1} / 20 題`;$('score').textContent=`⭐ ${score} 分`;$('bar').style.width=(i/20*100)+'%';$('question').textContent=x.q;$('scene').innerHTML=x.s.map(svg).join('');$('options').innerHTML='';x.a.forEach((v,j)=>{let b=document.createElement('button');b.className='opt';b.textContent=v;b.onclick=()=>answer(j);$('options').appendChild(b)});$('feedback').textContent='選出正確答案吧！';$('next').classList.add('hide');if(voiceEnabled)speakQuestion()}
function answer(j){if(locked)return;locked=true;let x=questions[i],ok=j===x.c;if(ok)score+=5;stopSpeech();chime(ok);[...$('options').children].forEach((b,k)=>{b.disabled=true;if(k===x.c)b.classList.add('correct');if(k===j&&!ok)b.classList.add('wrong')});$('score').textContent=`⭐ ${score} 分`;$('feedback').textContent=(ok?'🎉 答對了！ ':'💗 再記住這一點： ')+x.tip;$('next').textContent=i===19?'看我的成績 🏆':'下一題 ➜';$('next').classList.remove('hide');if(voiceEnabled)speak((ok?'答對了！':'這題的正確答案是'+x.a[x.c]+'。')+x.tip)}
function advance(){if(i<19){i++;render()}else{finish()}}function finish(){stopSpeech();$('play').classList.add('hide');$('end').classList.remove('hide');$('endingTitle').textContent='恭喜完成20題！';$('endingName').textContent=student;$('endingScore').textContent=`你的成績：${score} / 100 分`;$('trophy').textContent=score===100?'🏆':'🌟';$('endingMessage').textContent=score===100?'全部答對！你是立體圖形小博士！':score>=75?'非常好！再試一次，挑戰滿分！':'完成挑戰了！再練習一次，會愈來愈進步！'}function restart(){stopSpeech();i=0;score=0;locked=false;$('end').classList.add('hide');$('welcome').classList.remove('hide')}
</script></body></html>
